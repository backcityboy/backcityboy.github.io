<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl - Dashboard</title>
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/images/logosmartcontrol.png">
</head>

<header>
    <div class="texto_logo">
        <div class="smartcontrol">
            <img src="assets/images/logosmartcontrol.png" alt="logo_smart_control" width="80" height="auto">
            <h1 id="smart">Smart</h1>
            <h1 id="control">Control</h1>
        </div>
        <h1 id="inicio">Início</h1>
        <img id="foto_perfil" src="assets/images/images.jpg" alt="foto de perfil" width="60" height="auto">
    </div>
</header>

<body> 
    <div>       
        <section class="linha1">
            <div class="caixa1" id="item1">
                <h1 id="texto_cima_item1">Consumo de Energia</h1>
                <div class="imagem_texto_item1">
                    <img src="assets/images/images.jpg" alt="" id="imagem_item1">
                    <h1 id="texto_meio_item1">12.4 kWh</h1>
                </div>
                <h2 id="texto_baixo_item1">8% vs ontem</h2>
            </div>

            <div class="caixa1" id="item2">
                <h1 id="texto_cima_item2">Dispositivos Ativos</h1>
                <div class="imagem_texto_item2">
                    <img src="assets/images/images.jpg" alt="" id="imagem_item2">
                    <h1 id="texto_meio_item2">18</h1>
                </div>
                <h2 id="texto_baixo_item2">de 24 dispositivos</h2>
            </div>

            <div class="caixa1" id="item3">
                <h1 id="texto_cima_item3">Temperatura Média</h1>
                <div class="imagem_texto_item3">
                    <img src="assets/images/images.jpg" alt="" id="imagem_item3">
                    <h1 id="texto_meio_item3">24°C</h1>
                </div>
                <h2 id="texto_baixo_item3">Sala de estar</h2>
            </div>

            <div class="caixa1" id="item4">
                <h1 id="texto_cima_item4">Segurança</h1>
                <div class="imagem_texto_item4">
                    <img src="assets/images/images.jpg" alt="" id="imagem_item4">
                    <h1 id="texto_meio_item4">Tudo seguro</h1>
                </div>
                <h2 id="texto_baixo_item4">Nenhum alerta</h2>
            </div>
        </section>
    </div> 
</body>
</html>
