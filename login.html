<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Entrar | Q-Pastel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/style.css" rel="stylesheet">
</head>

<body class="auth-bg">
    <div class="container py-4"><a class="qp-brand text-decoration-none"
            href="index.html"><span>Q</span>-Pastel</a><button id="themeToggle"
            class="btn btn-sm btn-outline-orange rounded-pill float-end">🌙</button></div>
    <main class="container auth-wrap">
        <div class="auth-card mx-auto">
            <div class="text-center mb-4">
                <div class="logo-bubble"></div>
                <h1 class="fw-black mt-3">Bem-vindo de volta!</h1>
                <p class="text-secondary">Entre para pedir seus favoritos.</p>
            </div>
            <form id="loginForm" novalidate>
                <label class="form-label">E-mail</label><input id="email" type="email"
                    class="form-control form-control-lg mb-2" placeholder="voce@email.com" required>
                <div class="invalid-feedback mb-2">Digite um e-mail válido.</div>
                <label class="form-label">Senha</label><input id="password" type="password"
                    class="form-control form-control-lg mb-2" placeholder="Mínimo de 6 caracteres" required
                    minlength="6">
                <div class="invalid-feedback mb-2">A senha precisa ter pelo menos 6 caracteres.</div>
                <div class="d-flex justify-content-between align-items-center my-3"><label class="small"><input
                            type="checkbox" class="form-check-input me-1"> Lembrar de mim</label><a href="#"
                        class="link-orange small">Esqueci minha senha</a></div>
                <button class="btn btn-orange btn-lg w-100 rounded-pill">Entrar</button>
                <div id="loginAlert" class="alert d-none mt-3"></div>
            </form>
            <p class="text-center mt-4 mb-0">Ainda não tem conta? <a class="link-orange fw-bold"
                    href="cadastro.html">Cadastre-se</a></p>
            <div class="demo-box mt-4"><strong>Demo admin</strong><br><small>admin@qpastel.com / admin123</small></div>
        </div>
    </main>
    <script src="assets/app.js"></script>
    <script src="assets/auth.js"></script>
</body>

</html>
