<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl - Esqueci Minha Senha</title>
    <link rel="stylesheet" href="assets/css/esqueceu2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/images/logosmartcontrol.png">
</head>
<body>
    <div class="container">
        <div class="senha2">
            <div class="cabeca">
                <img src="assets/images/logosmartcontrol.png" alt="logo_smart_control" width="100" height="auto">
                <h1>SmartControl</h1>
            </div>
        
            <form action="dashboard.html" method="get" class="formulario">
                <label for="codigo">Digite o código que lhe foi enviado por E-mail</label>
                <input type="text" name="codigo" id="codigo" class="inputs" required placeholder="Código...">
                <button type="submit" class="botao">Avançar</button>
            </form>
        </div>
    </div>
</body>
</html>
