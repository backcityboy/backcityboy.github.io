<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Control Da Silva</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/images/images (1).jpg">
  <link rel="stylesheet" href="assets/css/cadastro.css">
  <style>
    .bg-custom-image {
      background: url('assets/images/Massa-de-Pastel-de-Feira.png') center/cover no-repeat;
    }
  </style>
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-4">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10">
        <div class="card border-0 shadow-lg overflow-hidden">
          <div class="row g-0">

            <div class="col-md-6 p-4 p-md-5 bg-white">
              <div class="text-center mb-4">
                <h1 class="h3 fw-bold">Página de Cadastro</h1>
                <img src="assets/images/images (1).jpg" alt="logo" class="rounded-circle mt-2" style="max-width: 120px; width: 100%;">
              </div>

              <form action="dashboard.html" method="get">
                <div class="mb-3">
                  <label for="nome_completo" class="form-label text-muted">Nome Completo:</label>
                  <input type="text" class="form-control" name="nome_completo" id="nome_completo" placeholder="Digite seu Nome completo..." required>
                </div>

                <div class="mb-3">
                  <label for="cpf" class="form-label text-muted">CPF:</label>
                  <input type="text" class="form-control" name="cpf" id="cpf" placeholder="Digite sem pontuação..." minlength="11" maxlength="11" required>
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label text-muted">Email:</label>
                  <input type="email" class="form-control" name="email" id="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="mb-3">
                  <label for="senha" class="form-label text-muted">Senha:</label>
                  <input type="password" class="form-control" name="senha" id="senha" placeholder="Sua senha" minlength="8" maxlength="12" required>
                </div>

                <div class="mb-3">
                  <label for="confirmar_senha" class="form-label text-muted">Confirmar Senha:</label>
                  <input type="password" class="form-control" name="confirmar_senha" id="confirmar_senha" placeholder="Confirme Sua senha" minlength="8" maxlength="12" required>
                </div>

                <div class="form-check mb-2">
                  <input type="checkbox" class="form-check-input" name="termos" id="termos" required>
                  <label for="termos" class="form-check-label text-muted">Aceite os Termos do site</label>
                </div>

                <div class="form-check mb-4">
                  <input type="checkbox" class="form-check-input" name="condicoes" id="condicoes" required>
                  <label for="condicoes" class="form-check-label text-muted">Aceite as Condições do site</label>
                </div>

                <button type="submit" class="btn w-100 fw-bold py-2 mb-3" ID="Entrar">Entrar</button>

                <div class="text-center small text-muted">
                  Já possui conta? <a href="Login.html" class="text-decoration-none fw-bold" ID="Faça">Faça Login</a>
                </div>
              </form>
            </div>

            <div class="col-md-6 d-none d-md-block bg-custom-image"></div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
