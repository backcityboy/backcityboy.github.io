<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl - Criar Conta</title>
    <link rel="stylesheet" href="assets/css/cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/images/logosmartcontrol.png">
</head>

<body>
    <div class="container">
        <div class="cadastro">
            <div class="cabeca">
                <img src="assets/images/logosmartcontrol.png" alt="logo_smart_control" width="100" height="auto">
                <h1>SmartControl</h1>
            </div>
            <form action="dashboard.html" method="get" class="formulario">
                <label for="nome">Nome Completo</label>
                <input type="text" name="nome_completo" id="nome" placeholder="Digite seu nome..." required class="inputs">
                <label for="email">E-mail</label>
                <input type="email" name="e-mail" id="email" placeholder="Digite seu e-mail..." required class="inputs">
                <label for="senha">Senha</label>
                <input type="password" name="senha" id="senha" placeholder="Digite sua senha..." minlength="8" required class="inputs">
                <button type="submit" class="botao">Criar Conta</button>
                <div class="fazer_login">
                    <p>Já possui uma conta?</p>
                    <a href="index.html" id="faz_aqui">Faça Login aqui.</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
