<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl - Fazer Login</title>   
</head>

<header>
    <img src="assets/images/logo-smart.webp" alt="logo_smart_control" width="64" height="auto">
    <h1>SmartControl</h1>
</header>

<body>
    <form action="dashboard.html" method="get" id="formulario">        
        <label for="email">E-mail</label>
        <input type="email" name="email_corporativo" id="email" required placeholder="Digite seu e-mail...">
        <label for="senha">Senha</label>
        <input type="password" name="senha" id="senha" required minlength="8" placeholder="Digite sua senha...">
        <button type="submit" id="log-in">Fazer Login</button>      
        <a href="cadastro.html">Cadastrar-se</a>
    </form> 
</body>
</html>
