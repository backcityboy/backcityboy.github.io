<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl - Fazer Login</title>
    <!--<link rel="stylesheet" href="assets/css/style.css">!-->
</head>

<header>
     <!--<img class="foto_perfil" src="assets/images/foto_perfil_goku_black.webp" alt="Foto de Perfil">!-->
    <h1>SmartControl</h1>
</header>

<body>
    <form action="inicio.html" method="get" id="formulario">        
        <label for="email" class="labels">E-mail</label>
        <input type="email" name="email_corporativo" id="email" required class="botao" placeholder="Digite seu e-mail...">
        <label for="senha" class="labels">Senha</label>
        <input type="password" name="senha" id="senha" required minlength="8" class="botao" placeholder="Digite sua senha...">
        <button type="submit" class="botao" id="log-in">Fazer Login</button>       
    </form>
    <a href="">Esqueceu a Senha?</a>
    
    <footer>
        <div class="criar_conta">
            <p>Não possui uma conta?</p><a href="">Clique Aqui</a>
        </div>  
    </footer>

</body>
</html>
