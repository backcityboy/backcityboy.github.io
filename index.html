<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl - Início</title>
    <!--<link rel="stylesheet" href="assets/css/style.css">/!-->
</head>

<header>
    <h1>Cadastro de Usuário</h1>
    <h2>Preencha os dados de acesso do sistema</h2>
</header>

<body>
    <form action="" method="post" id="formulario">
        <label for="nome_completo" class="labels">Nome Completo:</label>
        <input type="text" name="nome_completo" id="nome_completo" placeholder="Digite seu nome..." required class="botao">
        <label for="email" class="labels">E-mail Corporativo</label>
        <input type="email" name="email_corporativo" id="email" required class="botao">
        <label for="senha" class="labels">Senha de Acesso</label>
        <input type="password" name="senha" id="senha" required minlength="8" class="botao">
        <button type="submit" class="botao">Salvar Usuário</button>
        <button type="reset" class="botao">Cancelar Operação</button>
    </form>
</body>
</html>
