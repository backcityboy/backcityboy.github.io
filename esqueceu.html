<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl - Esqueci Minha Senha</title>
    <link rel="stylesheet" href="assets/css/esqueceu.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/images/logosmartcontrol.png">
</head>
<body>
    <div class="container">
        <div class="senha">
            <div class="cabeca">
                 <img src="assets/images/logosmartcontrol.png" alt="logo_smart_control" width="100" height="auto">
                 <h1>SmartControl</h1>
            </div>

            <form action="index.html" method="get" class="formulario">
                <label for="email">Insira seu E-mail para a recuperação da senha</label>
                <input type="email" name="email" id="email" required placeholder="E-mail..." class="inputs">
                <button type="submit" class="botao">Avançar</button>
            </form>
        </div>
    </div>
</body>
</html>
